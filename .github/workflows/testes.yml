name: testes
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[api,dev]"
      - run: pytest -q
      - name: a API sobe e gera o OpenAPI
        run: python -c "import api.main as m; s=m.app.openapi(); print(len(s['paths']), 'rotas')"
