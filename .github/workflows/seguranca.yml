name: seguranca
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # toda segunda: CVE nova aparece sem ninguém mexer no código

# o mínimo: o job só lê o repositório
permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguranca:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSAO: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # actions fixadas por SHA de commit (tag pode ser movida); o comentário diz a versão
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # histórico inteiro pro gitleaks
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: dependências (só do lock, hash conferido)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip check

      - name: testes de segurança
        run: python -m pytest -q tests/seguranca

      - name: ferramentas (lock próprio, hash conferido, fora do ambiente do app)
        run: |
          python -m venv /tmp/ferr
          /tmp/ferr/bin/pip install --require-hashes --no-deps -r .github/ferramentas-seguranca.lock

      - name: bandit (SAST)
        run: /tmp/ferr/bin/bandit -r api sigaa -q

      - name: pip-audit (CVEs nas dependências travadas)
        run: |
          /tmp/ferr/bin/pip-audit -r requirements.lock --require-hashes --disable-pip --strict
          /tmp/ferr/bin/pip-audit -r requirements-dev.lock --require-hashes --disable-pip --strict

      - name: gitleaks (histórico inteiro + árvore)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts="--all" --config .gitleaks.toml --redact --no-banner
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner
