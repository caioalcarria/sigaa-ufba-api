[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigaa-ufba-api"
version = "0.1.0"
description = "API REST não oficial (somente leitura) e cliente Python para o SIGAA da UFBA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pydantic>=2.6",
  "pdfplumber>=0.11",
  "pypdfium2>=4.18",  # já vem com o pdfplumber; usado direto no extrair_texto (rápido)
  # pisos de SEGURANÇA de dependências indiretas (o lock fixa a versão exata — requirements.lock)
  "pdfminer.six>=20251107",  # CVE-2025-64512 (pickle no carregamento de CMap)
  "h11>=0.16",  # CVE-2025-43859 (request smuggling)
]

[project.optional-dependencies]
# sem uvicorn[standard]: ele traz watchfiles/websockets/pyyaml/python-dotenv, que o servidor não usa.
# uvloop + httptools são os dois que o CMD do Dockerfile pede.
api = [
  "fastapi>=0.115",
  "starlette>=0.47.2",  # CVE-2025-54121 / CVE-2024-47874 (DoS em multipart)
  "uvicorn>=0.30",
  "uvloop>=0.19; sys_platform != 'win32'",
  "httptools>=0.6",
  "cryptography>=44.0.1",
]
redis = ["redis>=5"]  # cache L2 compartilhado (SIGAA_API_CACHE_URL)
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyyaml>=6"]  # pyyaml: teste do compose (tests/seguranca)

[tool.setuptools.packages.find]
include = ["sigaa*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
